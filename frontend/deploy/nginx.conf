# ============================================================
#  企业差旅管理工具 —— 前端 nginx 配置
#  用法见 deploy/README 说明，这里给出两种形态：
#  ① 完整主配置（把本文件内容整份替换到 nginx/conf/nginx.conf）
#  ② 若不想动主配置，只把 server { ... } 段贴进 nginx.conf 的 http { } 里即可
# ============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain application/javascript application/json text/css;

    # 上传票据影像最大 10MB，与 application.yml 的 multipart 上限保持一致
    client_max_body_size 10m;

    upstream travel_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen       8088;
        server_name  localhost;

        # dist 目录绝对路径：Windows 下用正斜杠，路径不要带中文空格
        root   ${USER_HOME}/Desktop/金舟面试项目/前端/dist;
        index  index.html;

        # 前端静态资源，带 hash 缓存一年
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 接口转发到后端；后端没起来时这里会返回 502，前端会提示去检查 Spring Boot
        location /api/ {
            # ---- 跨域交给 nginx 兜下来 ----
            # 浏览器只要不是从后端自己的 8080 出发，就都算跨域：
            # 提交 JSON 前会先发一次 OPTIONS 预检。后端 CorsConfig 的白名单只有 5173 和 80，
            # 见到 8088（或隧道域名）这种陌生来源会直回 403「Invalid CORS request」，
            # 前端收到 403 就弹「无权限访问该接口」。
            # 解法：预检在这里就地应答，同时把请求里的 Origin 抹掉，
            # 让后端把它当同源请求处理，不必再拿自己那份白名单判一次。
            # 附带好处：换成 cpolar / Cloudflare 隧道域名（免费域名每次重启都变）也一行都不用改。
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 3600 always;
                add_header Content-Length 0;
                return 204;
            }
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Vary Origin always;

            proxy_pass http://travel_backend;
            proxy_set_header Host $host;
            proxy_set_header Origin "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;

            # 票据影像读取较慢，不开缓冲避免前端等待假死
            proxy_buffering off;
        }

        # ---- 移动端 H5（uni-app 产物），与 PC 端共用 8088 一条隧道 ----
        # 访问地址：<隧道域名>/m/  ，PC 端仍是 <隧道域名>/
        # 产物路径改了的话（小程序端目录搬走），改下面这一行 alias
        location /m/ {
            alias ${USER_HOME}/Desktop/金舟面试项目/小程序端/dist/build/h5/;
            index index.html;
            # 移动端也是 hash 路由，try_files 兜一层即可，不加也不会影响刷新
            try_files $uri $uri/ /m/index.html;
        }
        location = /m {
            return 301 /m/;
        }

        # ---- App 热更新（wgt 资源包 + 版本清单），走同一条隧道，手机经 cpolar / 局域网 nginx 拉取 ----
        # 更新基址 = 后端地址去掉 /api；wgt 与 update.json 放下面 alias 目录
        location /update/ {
            alias ${USER_HOME}/Desktop/金舟面试项目/小程序端/update/;
            add_header Cache-Control "no-cache";
            default_type application/octet-stream;
        }

        # 前端采用 hash 路由（#/employee/apply），不需要 try_files 兜底；
        # 若后续改成 history 路由，把下面两行注释放开即可
        # location / {
        #     try_files $uri $uri/ /index.html;
        # }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
